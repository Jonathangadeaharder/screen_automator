[tool:pytest]
# Pytest configuration for Screen Automator

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py test_comprehensive.py
python_classes = Test*
python_functions = test_*

# Output options
addopts = 
    --strict-markers
    --disable-warnings
    --tb=short
    -ra
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=70

# Markers for test categorization
markers =
    unit: Unit tests
    integration: Integration tests
    gui: GUI tests
    cli: CLI tests
    core: Core functionality tests
    slow: Slow tests
    network: Tests requiring network access

# Test timeout
timeout = 300

# Minimum version
minversion = 6.0

# Console output
console_output_style = progress

# Collect coverage for these directories
# (configured in run_tests.py and pyproject.toml) 